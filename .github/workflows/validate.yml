name: Validate localization data

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install Pillow==12.3.0

      - name: Run translation smoke tests
        run: dotnet run --project tools/TranslationSmokeTests/TranslationSmokeTests.csproj -- translation.txt

      - name: Validate release data
        run: python tools/validate_release.py
