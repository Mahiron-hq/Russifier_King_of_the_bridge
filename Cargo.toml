[workspace]
resolver = "3"
members = ["installer", "patchset"]

[workspace.package]
version = "0.4.0-beta.1"
edition = "2024"
rust-version = "1.95"
authors = ["Lev Burmistrov (Mahiron-hq)"]
license = "CC-BY-NC-SA-4.0"
repository = "https://github.com/Mahiron-hq/Russifier_King_of_the_bridge"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "links"] }
egui = "0.37.0"
egui_kittest = { version = "0.37.0", features = ["snapshot", "wgpu", "eframe"] }
hex = { version = "0.4.3", features = ["serde"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
known-folders = "1.4.2"
proptest = "1.12.0"
qbsdiff = "1.4.4"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
steamlocate = "2.1.1"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
winresource = "0.1.34"
patchset = { path = "patchset" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
